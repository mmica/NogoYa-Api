<div class="min-h-screen flex flex-col bg-stone-50">
  <mat-toolbar class="!bg-white !text-stone-900 border-b border-stone-200 sticky top-0 z-10 !h-16">
    <a routerLink="/home" class="flex items-center gap-2 no-underline text-stone-900">
      <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center">
        <mat-icon class="!text-lg">storefront</mat-icon>
      </div>
      <span class="font-medium text-lg tracking-tight">Nogo-Ya</span>
    </a>
    <span class="flex-1"></span>

    <nav class="hidden md:flex items-center gap-1">
      <a mat-button routerLink="/stores" routerLinkActive="!text-brand-700 !bg-brand-50">Comercios</a>
      <a mat-button routerLink="/products" routerLinkActive="!text-brand-700 !bg-brand-50">Productos</a>
    </nav>

    <a mat-icon-button routerLink="/cart" aria-label="Carrito">
      <mat-icon [matBadge]="cart.itemCount()" matBadgeColor="primary"
                [matBadgeHidden]="cart.itemCount() === 0">shopping_cart</mat-icon>
    </a>

    <button mat-icon-button [matMenuTriggerFor]="settingsMenu" aria-label="Configuración">
      <mat-icon>settings</mat-icon>
    </button>
    <mat-menu #settingsMenu="matMenu" xPosition="before">
      <div class="px-4 pt-2 pb-1 text-xs uppercase tracking-wider text-stone-500">Configuración</div>
      <a mat-menu-item routerLink="/settings">
        <mat-icon>tune</mat-icon><span>Panel de configuración</span>
      </a>
      <mat-divider></mat-divider>
      <a mat-menu-item routerLink="/settings/stores">
        <mat-icon>store</mat-icon><span>Administrar comercios</span>
      </a>
      <a mat-menu-item routerLink="/settings/products">
        <mat-icon>shopping_bag</mat-icon><span>Administrar productos</span>
      </a>
      <a mat-menu-item routerLink="/settings/import-products">
        <mat-icon>upload_file</mat-icon><span>Importar productos</span>
      </a>
      <a mat-menu-item disabled>
        <mat-icon>receipt_long</mat-icon><span>Historial de auditoría</span>
      </a>
    </mat-menu>
  </mat-toolbar>

  <main class="flex-1 container mx-auto px-4 py-8">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-stone-200 bg-white py-6 text-center text-sm text-stone-500">
    © {{ year }} Nogo-Ya · Marketplace local de Nogoyá
  </footer>
</div>
