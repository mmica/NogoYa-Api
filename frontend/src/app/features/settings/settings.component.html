<header class="mb-8">
  <h1 class="text-3xl font-semibold tracking-tight text-stone-900">Configuración</h1>
  <p class="text-stone-600 mt-1">Administrá tu comercio y tus datos en Nogo-Ya.</p>
</header>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (entry of entries; track entry.route) {
    <a [routerLink]="entry.disabled ? null : entry.route"
       [class.pointer-events-none]="entry.disabled"
       [class.opacity-50]="entry.disabled"
       class="no-underline bg-white rounded-2xl border border-stone-200 hover:border-brand-300 transition-colors p-5 block">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0">
          <mat-icon>{{ entry.icon }}</mat-icon>
        </div>
        <div>
          <h3 class="font-medium text-stone-900">{{ entry.label }}</h3>
          <p class="text-sm text-stone-600 mt-0.5">{{ entry.description }}</p>
          @if (entry.disabled) {
            <span class="text-xs text-stone-400 italic">Próximamente</span>
          }
        </div>
      </div>
    </a>
  }
</div>
